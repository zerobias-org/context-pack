name: Publish

# Thin caller — the pipeline lives in
# zerobias-org/devops/.github/workflows/zbb-publish-reusable.yml, same as
# auditlogic/module and the migrated content repos.
#
# Safe for pin-carrying packs BECAUSE this repo is not an npm workspace and
# its root package.json declares no dependencies: Prepublish.resolve() has
# nothing to hoist, so each pack's exact pins survive publish. The root's
# verifyRootHasNoDeps task fails the gate if that ever stops being true.

on:
  push:
    branches: [main]
    paths:
      - 'package/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
    inputs:
      pack:
        description: 'Pack to publish (e.g. context-pack-dev). Blank for all changed.'
        required: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    uses: zerobias-org/devops/.github/workflows/zbb-publish-reusable.yml@main
    with:
      package-depth: 1
      dispatch-input-name: pack
      dispatch-input-value: ${{ inputs.pack }}
    secrets: inherit
