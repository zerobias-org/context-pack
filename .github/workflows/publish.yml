name: Publish

# Deliberately a plain npm publish, NOT the zb.monorepo-* gradle pipeline.
#
# That pipeline's Prepublish.resolve() rewrites each package's dependency
# versions from the monorepo root at publish time. These packs exist to carry
# pins for their consumers, so having them overwritten defeats the package.
# See README "Why this repo is not a zbb monorepo".

on:
  push:
    branches: [main]
    paths: ['packages/**']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Authenticate to Vault
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: jwt
          role: publishing-role
          path: gh-actions
          jwtGithubAudience: "https://github.com/zerobias-org"
          secrets: |
            operations-kv/data/ci/github writePackagesToken | NPM_TOKEN ;
            operations-kv/data/ci/github zb-token | ZB_TOKEN

      # Publish each workspace whose version is not already on the registry.
      # No version bumping here on purpose: these packs pin toolchains, so a
      # release is a deliberate act — bump the version in the PR that changes
      # the pins, and merging publishes exactly that.
      - name: Publish changed packages
        env:
          ZB_TOKEN: ${{ env.ZB_TOKEN }}
        run: |
          set -euo pipefail
          published=0
          for dir in packages/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            if npm view "${name}@${version}" version --registry=https://pkg.zerobias.org >/dev/null 2>&1; then
              echo "= ${name}@${version} already published — skipping"
              continue
            fi
            echo "→ publishing ${name}@${version}"
            (cd "$dir" && npm publish --registry=https://pkg.zerobias.org)
            published=$((published + 1))
          done
          echo "published ${published} package(s)"
